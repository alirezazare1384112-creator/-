name: Debug X Access 3
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe translate proxies
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:132.0) Gecko/20100101 Firefox/132.0"
          H="hey_itsmyturn"

          echo "=== 1) x-com.translate.goog ==="
          curl -s --compressed -L --max-time 30 -A "$UA" -o /tmp/t1.html -w "code %{http_code} size %{size_download} url %{url_effective}\n" "https://x-com.translate.goog/$H?_x_tr_sl=auto&_x_tr_tl=en&_x_tr_hl=en" || true
          grep -aoE "status/[0-9]{15,}" /tmp/t1.html | head -4 || true
          grep -ao "<title>[^<]*" /tmp/t1.html | head -1 || true
          echo

          echo "=== 2) twitter-com.translate.goog ==="
          curl -s --compressed -L --max-time 30 -A "$UA" -o /tmp/t2.html -w "code %{http_code} size %{size_download} url %{url_effective}\n" "https://twitter-com.translate.goog/$H?_x_tr_sl=auto&_x_tr_tl=en&_x_tr_hl=en" || true
          grep -aoE "status/[0-9]{15,}" /tmp/t2.html | head -4 || true
          echo

          echo "=== 3) old google translate endpoint ==="
          curl -s --compressed -L --max-time 30 -A "$UA" -o /tmp/t3.html -w "code %{http_code} size %{size_download} url %{url_effective}\n" "https://translate.google.com/translate?sl=auto&tl=en&u=https://x.com/$H" || true
          grep -aoE "status/[0-9]{15,}" /tmp/t3.html | head -4 || true
          echo

          echo "=== 4) corsproxy.io ==="
          curl -s --max-time 30 -o /tmp/t4.txt -w "code %{http_code} size %{size_download}\n" "https://corsproxy.io/?url=https%3A%2F%2Fx.com%2F$H" || true
          grep -aoE "status/[0-9]{15,}" /tmp/t4.txt | head -4 || true
          head -c 150 /tmp/t4.txt; echo
          echo

          echo "=== 5) codetabs proxy ==="
          curl -s --max-time 35 -o /tmp/t5.txt -w "code %{http_code} size %{size_download}\n" "https://api.codetabs.com/v1/proxy?quest=https://x.com/$H" || true
          grep -aoE "status/[0-9]{15,}" /tmp/t5.txt | head -4 || true
          head -c 150 /tmp/t5.txt; echo
          echo

          echo "=== 6) syndication tweet-result sanity ==="
          curl -s --compressed --max-time 25 -A "$UA" -e "https://platform.twitter.com/" "https://cdn.syndication.twimg.com/tweet-result?id=2112207638356189214&lang=en&token=a" | head -c 200; echo

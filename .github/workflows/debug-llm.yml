name: Debug LLM
on:
  workflow_dispatch:
  repository_dispatch:
    types: [debug-llm]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pollinations reachability test
        run: |
          echo "testing pollinations from runner..."
          RESP=$(curl -s --max-time 90 -X POST https://text.pollinations.ai/openai \
            -H "Content-Type: application/json" \
            -d '{"model":"openai","temperature":0.4,"messages":[{"role":"user","content":"بگو: تست موفق"}]}')
          echo "RAW_RESPONSE: $RESP" | head -c 600
          echo ""
          echo "$RESP" | python3 -c "import json,sys; d=json.load(sys.stdin); print('ANALYSIS_ENGINE_OK:', d['choices'][0]['message']['content'][:200])" || echo "ANALYSIS_ENGINE_FAIL"

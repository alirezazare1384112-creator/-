name: Twitter Monitor

on:
  schedule:
    # every 5 minutes (GitHub may delay a few minutes under load)
    - cron: '*/5 * * * *'
  # external cron services can trigger this (POST repository_dispatch {"event_type":"monitor"})
  repository_dispatch:
    types: [monitor]
  # allows manual "Run workflow" button for testing
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: twitter-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run monitor
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python monitor.py

      - name: Commit state
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add state.json || true
          git diff --cached --quiet || (git commit -m "state update [skip ci]" && git push)

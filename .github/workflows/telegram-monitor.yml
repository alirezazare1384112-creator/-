name: Twitter Monitor

on:
  schedule:
    # safety net: GitHub may throttle this heavily; the chain keeps it alive
    - cron: '*/5 * * * *'
  # external triggers (the self-chaining step uses this)
  repository_dispatch:
    types: [monitor]
  # allows manual "Run workflow" button for testing
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: twitter-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run monitor
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          # state/ledger sync via Contents API needs one of these tokens.
          # THIS WAS THE BUG: GITHUB_TOKEN was missing before, so every run
          # re-sent the same tweets (state was never persisted).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python monitor.py

      # state + ledger are synced via the Contents API inside monitor.py,
      # so no git commit/push happens here -> no conflicts with the sandbox.

      - name: Chain next run
        # only chain when the monitor succeeded - a failed run (e.g. push
        # failure) must PAUSE the chain instead of re-sending in a loop;
        # the */5 schedule restarts it automatically.
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
          MY_NUM: ${{ github.run_number }}
        run: |
          set -e
          # pace the chain: ~60s pause => new tweet arrives in <= ~2.5 min,
          # while keeping the number of daily runs sane
          sleep 60
          NEWER_ACTIVE=$(gh api "repos/$REPO/actions/workflows/telegram-monitor.yml/runs?per_page=100" \
            --jq "[.workflow_runs[] | select((.status==\"queued\" or .status==\"in_progress\") and .run_number > ${MY_NUM})] | length")
          echo "my run_number=$MY_NUM newer_active=$NEWER_ACTIVE"
          if [ "$NEWER_ACTIVE" -eq 0 ]; then
            gh api "repos/$REPO/dispatches" -f event_type='monitor' \
              -F 'client_payload[src]=chain' && echo "chained next run"
          else
            echo "a newer run is active/queued - it will carry the chain"
          fi

name: Twitter Monitor

on:
  schedule:
    # safety net: GitHub may throttle this heavily; the chain keeps it alive
    - cron: '*/5 * * * *'
  # external triggers (the self-chaining step uses this)
  repository_dispatch:
    types: [monitor]
  # allows manual "Run workflow" button for testing
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: twitter-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run monitor
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python monitor.py

      # state is synced via the Contents API inside monitor.py (GITHUB_TOKEN),
      # so no git commit/push happens here -> no conflicts with the sandbox.

      - name: Chain next run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          # count active runs of this workflow (queued or in_progress, incl. this one)
          ACTIVE=$(gh api "repos/$REPO/actions/workflows/telegram-monitor.yml/runs?per_page=100" \
            --jq '[.workflow_runs[] | select(.status=="queued" or .status=="in_progress")] | length')
          echo "active runs (incl. self): $ACTIVE"
          if [ "$ACTIVE" -le 1 ]; then
            gh api "repos/$REPO/dispatches" -f event_type='monitor' \
              -F 'client_payload[src]=chain' && echo "chained next run"
          else
            echo "another run already active/queued - it will carry the chain"
          fi

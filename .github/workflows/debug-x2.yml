name: Debug X Access 2
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe mirrors
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:132.0) Gecko/20100101 Firefox/132.0"
          H="hey_itsmyturn"

          for HOST in xcancel.com twstalker.com lightbrd.com nitter.poast.org nitter.privacyredirect.com twiiit.com; do
            echo "=== $HOST/$H ==="
            curl -s --compressed -L --max-time 25 -A "$UA" -o /tmp/m.html -w "code %{http_code} size %{size_download} url %{url_effective}\n" "https://$HOST/$H" 2>&1
            grep -aoE 'status/[0-9]{15,}' /tmp/m.html | head -3
            head -c 150 /tmp/m.html; echo; echo
          done

          echo "=== syndication timeline-profile retry x3 (30s apart) ==="
          for i in 1 2 3; do
            sleep 30
            curl -s --compressed -L --max-time 25 -A "$UA" -o /tmp/tl.html -w "try$i: code %{http_code} size %{size_download}\n" "https://syndication.twitter.com/srv/timeline-profile/screen-name/$H"
            grep -aoE 'status/[0-9]{15,}' /tmp/tl.html | head -3
            head -c 100 /tmp/tl.html; echo
          done
